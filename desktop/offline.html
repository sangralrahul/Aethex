<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Cadus</title>
<style>
  :root { --bg:#FAFAF8; --text:#14171C; --t2:#5B6270; --line:#E4E2DC; --acc:#1F3F7A; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --text:#E9EBEF; --t2:#A2A9B6; --line:#2A2F37; --acc:#8DB4F5; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Ubuntu, sans-serif; padding: 24px; }
  main { max-width: 420px; text-align: center; }
  svg { width: 56px; height: 56px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 18px 0 8px; }
  p { color: var(--t2); margin: 0 0 22px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--acc); border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0E1A2E; } }
  small { display: block; margin-top: 18px; color: var(--t2); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g" x1="0.12" y1="0.02" x2="0.88" y2="0.98"><stop offset="0" stop-color="#67E8D6"/><stop offset="0.48" stop-color="#14B8A6"/><stop offset="1" stop-color="#2563EB"/></linearGradient><mask id="m"><rect width="100" height="100" fill="#fff"/><path d="M50 35Q52.25 47.75 65 50Q52.25 52.25 50 65Q47.75 52.25 35 50Q47.75 47.75 50 35Z" fill="#000"/></mask></defs><path d="M49 6H51A17 17 0 0 1 68 23V24A8 8 0 0 0 76 32H77A17 17 0 0 1 94 49V51A17 17 0 0 1 77 68H76A8 8 0 0 0 68 76V77A17 17 0 0 1 51 94H49A17 17 0 0 1 32 77V76A8 8 0 0 0 24 68H23A17 17 0 0 1 6 51V49A17 17 0 0 1 23 32H24A8 8 0 0 0 32 24V23A17 17 0 0 1 49 6Z" fill="url(#g)" mask="url(#m)"/></svg>
  <h1>Cadus can't connect</h1>
  <p>Check your internet connection. Cadus will open again as soon as you're back online.</p>
  <button id="retry" type="button">Try again</button>
  <small id="why"></small>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const target = /^https:\/\/((cadus|auth|login)\.)?aethex\.in(\/|$)/.test(q.get("retry") || "") ? q.get("retry") : "https://cadus.aethex.in/";
  const go = () => { location.href = target; };
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
  const code = q.get("code");
  if (code) document.getElementById("why").textContent = "Error " + code;
</script>
</body>
</html>
